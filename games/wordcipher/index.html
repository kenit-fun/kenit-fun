<body>
    <header>
        <a href="../../index.html" class="back-btn">&larr; KENITFUN HOME</a>
        <h2>WORD CIPHER</h2>
    </header>

    <div class="card">
        <div class="meta-bar">
            <span id="levelDisplay">Cipher: 1/50</span>
            <span id="timerDisplay">⏱️ 30s</span>
            <span id="scoreDisplay">Score: 0</span>
        </div>

        <div class="cipher-box">
            <div class="category-badge" id="catBadge">CATEGORY</div>
            <div class="scrambled-text" id="cipherText">LOADING...</div>
        </div>
        
        <div class="hint-text" id="hintDisplay">Hint: Loading...</div>

        <div class="status-msg" id="statusMsg"></div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="DECRYPT THE WORD..." autofocus autocomplete="off">
            <button class="action-btn" id="submitBtn">Decipher</button>
        </div>

        <div class="controls">
            <button class="action-btn" id="hintBtn">💡 Reveal Hint (-2 pts)</button>
            <button class="action-btn" id="skipBtn">⏭️ Skip (-5 pts)</button>
            <button class="action-btn" id="restartBtn">🔄 Reset Game</button>
        </div>
    </div>

    <footer>
        <p>&copy; KenitFun | <a href="../../privacy-policy.html" style="color:var(--border)">Privacy Policy</a> | <a href="../../terms.html" style="color:var(--border)">Terms</a></p>
    </footer>

    <script>
        // 50 Shuffled Vintage/Retro Themed Words
        const ciphersPool = [
            { word: "GRAMOPHONE", cat: "Vintage Objects", hint: "Early device for playing recorded sound" },
            { word: "WALKMAN", cat: "80s Tech", hint: "Portable cassette player revolutionized by Sony" },
            { word: "TYPEWRITER", cat: "Office Retro", hint: "Mechanical machine for writing characters" },
            { word: "PACMAN", cat: "Retro Gaming", hint: "Yellow arcade hero dodging ghosts in a maze" },
            { word: "CASSETTE", cat: "Music Formats", hint: "Magnetic tape housing for listening to music" },
            { word: "SLINKY", cat: "Classic Toys", hint: "Helical spring toy that walks down stairs" },
            { word: "TELEGRAM", cat: "Communication", hint: "Urgent written message sent via telegraph wires" },
            { word: "TELESCOPE", cat: "Scientific Instruments", hint: "Optical tool for viewing distant space objects" },
            { word: "AMBASSADOR", cat: "Classic Cars", hint: "Iconic vintage Indian automobile" },
            { word: "DISCO", cat: "70s Culture", hint: "Genre of dance music and nightclub style" },
            { word: "POLAROID", cat: "Photography", hint: "Camera that prints instant photos" },
            { word: "BOOMBOX", cat: "Street Culture", hint: "Portable transistor radio with heavy speakers" },
            { word: "TETRIS", cat: "Retro Gaming", hint: "Falling block puzzle game invented in USSR" },
            { word: "SPUTNIK", cat: "Space Age", hint: "First artificial earth satellite launched in 1957" },
            { word: "MONOPOLY", cat: "Board Games", hint: "Real estate trading game published in 1935" },
            { word: "HOURGLASS", cat: "Timekeeping", hint: "Glass vessel measuring time using trickling sand" },
            { word: "CONTRA", cat: "Retro Gaming", hint: "Classic 2-player run and gun arcade action" },
            { word: "PHONOGRAPH", cat: "Inventions", hint: "Edison's 1877 sound reproducing invention" },
            { word: "PAGER", cat: "90s Gadgets", hint: "Beeper device used before mobile phones" },
            { word: "VESPA", cat: "Classic Scooters", hint: "Iconic Italian motor scooter brand" },
            { word: "NINTENDO", cat: "Gaming History", hint: "Japanese giant behind NES and Game Boy" },
            { word: "KODAK", cat: "Photography", hint: "Pioneer company famous for photographic film" },
            { word: "METROPOLIS", cat: "Classic Cinema", hint: "1927 silent sci-fi movie masterpiece" },
            { word: "STRATOCASTER", cat: "Music Legends", hint: "Famous Electric guitar model introduced by Fender in 1954" },
            { word: "VINYL", cat: "Music Formats", hint: "Phonograph record disc material" },
            { word: "COMMODORE", cat: "Retro Computers", hint: "Makers of the C64 home computer" },
            { word: "ZEPPELIN", cat: "Aviation History", hint: "Large rigid airship named after Ferdinand" },
            { word: "SAXOPHONE", cat: "Instruments", hint: "Single-reed brass wind instrument invented in 1840s" },
            { word: "ASTEROIDS", cat: "Arcade Classics", hint: "1979 space vector arcade game" },
            { word: "SUPERMAN", cat: "Pop Culture", hint: "Comic hero debuting in Action Comics #1 (1938)" },
            { word: "GALAXY", cat: "Astronomy", hint: "Massive gravitationally bound system of stars" },
            { word: "JUKEBOX", cat: "Retro Venues", hint: "Partially automated music playing coin-operated box" },
            { word: "COMPASS", cat: "Navigation", hint: "Navigational instrument showing cardinal directions" },
            { word: "PERISCOPE", cat: "Submarine Tech", hint: "Instrument for observation over obstacles" },
            { word: "MARIO", cat: "Gaming Icons", hint: "Plumber character debuting in 1981 Donkey Kong" },
            { word: "HARLEY", cat: "Classic Motorcycles", hint: "Famous American bike manufacturer founded in 1903" },
            { word: "OVERCOAT", cat: "Vintage Fashion", hint: "Heavy warm coat worn over regular clothing" },
            { word: "TAMAGOTCHI", cat: "90s Toys", hint: "Handheld digital pet created in Japan" },
            { word: "CALCULATOR", cat: "Office Tech", hint: "Electronic device performing mathematical operations" },
            { word: "RADIO", cat: "Broadcasting", hint: "Technology of signaling using radio waves" },
            { word: "CONCORDE", cat: "Aviation", hint: "Supersonic passenger airliner operating until 2003" },
            { word: "BALLPOINT", cat: "Stationery", hint: "Pen invented by Laszlo Biro in 1938" },
            { word: "ATLANTIS", cat: "Mythology", hint: "Fictional island mentioned in Plato's works" },
            { word: "TELEX", cat: "Communication", hint: "International switched network of teleprinters" },
            { word: "TAJMAHAL", cat: "World Heritage", hint: "White marble mausoleum in Agra built in 1632" },
            { word: "RUBIK", cat: "Puzzle Toys", hint: "Hungarian architect who invented the 3D cube" },
            { word: "MICROPHONE", cat: "Audio Tech", hint: "Transducer converting sound into electrical signals" },
            { word: "CINEMA", cat: "Entertainment", hint: "Theatre where motion pictures are screened" },
            { word: "ALEXANDER", cat: "Famous Figures", hint: "Graham Bell who patented the telephone" },
            { word: "EINSTEIN", cat: "Scientists", hint: "Theoretical physicist who developed Relativity theory" }
        ];

        let ciphers = [];
        let cIndex = 0;
        let score = 0;
        let timer = 30;
        let timerInterval = null;

        const cipherText = document.getElementById('cipherText');
        const catBadge = document.getElementById('catBadge');
        const hintDisplay = document.getElementById('hintDisplay');
        const userInput = document.getElementById('userInput');
        const submitBtn = document.getElementById('submitBtn');
        const hintBtn = document.getElementById('hintBtn');
        const skipBtn = document.getElementById('skipBtn');
        const restartBtn = document.getElementById('restartBtn');
        const statusMsg = document.getElementById('statusMsg');
        const levelDisplay = document.getElementById('levelDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');

        function shuffle(arr) {
            let res = [...arr];
            for (let i = res.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [res[i], res[j]] = [res[j], res[i]];
            }
            return res;
        }

        function scrambleWord(word) {
            let arr = word.split('');
            if (arr.length <= 2) return word;
            let scrambled = word;
            while (scrambled === word) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                scrambled = arr.join('');
            }
            return scrambled;
        }

        function initGame() {
            ciphers = shuffle(ciphersPool);
            cIndex = 0;
            score = 0;
            updateMeta();
            loadCipher();
        }

        function updateMeta() {
            levelDisplay.innerText = `Cipher: ${cIndex + 1}/${ciphers.length}`;
            scoreDisplay.innerText = `Score: ${score}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timer = 30;
            timerDisplay.innerText = `⏱️ ${timer}s`;
            timerInterval = setInterval(() => {
                timer--;
                timerDisplay.innerText = `⏱️ ${timer}s`;
                if (timer <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function loadCipher() {
            if (cIndex >= ciphers.length) {
                clearInterval(timerInterval);
                cipherText.innerText = "ALL DECRYPTED!";
                catBadge.innerText = "VICTORY";
                hintDisplay.innerText = "";
                statusMsg.innerText = `🏆 Final Score: ${score}`;
                statusMsg.className = "status-msg correct";
                userInput.style.display = "none";
                submitBtn.style.display = "none";
                hintBtn.style.display = "none";
                skipBtn.style.display = "none";
                return;
            }

            userInput.style.display = "block";
            submitBtn.style.display = "block";
            hintBtn.style.display = "inline-block";
            skipBtn.style.display = "inline-block";
            userInput.value = "";
            statusMsg.innerText = "";
            statusMsg.className = "status-msg";

            const current = ciphers[cIndex];
            catBadge.innerText = current.cat.toUpperCase();
            cipherText.innerText = scrambleWord(current.word);
            hintDisplay.innerText = "Click 'Reveal Hint' if you get stuck!";
            
            updateMeta();
            startTimer();
            userInput.focus();
        }

        function checkAnswer() {
            const guess = userInput.value.trim().toUpperCase();
            const current = ciphers[cIndex];

            if (!guess) return;

            if (guess === current.word) {
                clearInterval(timerInterval);
                score += 10 + Math.floor(timer / 3);
                statusMsg.innerText = "🎉 CIPHER CRACKED! Excellent!";
                statusMsg.className = "status-msg correct";
                cipherText.innerText = current.word;

                setTimeout(() => {
                    cIndex++;
                    loadCipher();
                }, 1200);

            } else {
                statusMsg.innerText = "❌ Incorrect decryption! Try again.";
                statusMsg.className = "status-msg wrong";
            }
        }

        function revealHint() {
            const current = ciphers[cIndex];
            score = Math.max(0, score - 2);
            updateMeta();
            hintDisplay.innerText = `Hint: ${current.hint}`;
        }

        function skipCipher() {
            clearInterval(timerInterval);
            const current = ciphers[cIndex];
            score = Math.max(0, score - 5);
            statusMsg.innerText = `Skipped! The word was: "${current.word}"`;
            statusMsg.className = "status-msg wrong";
            cipherText.innerText = current.word;

            setTimeout(() => {
                cIndex++;
                loadCipher();
            }, 1500);
        }

        function handleTimeOut() {
            statusMsg.innerText = `⏰ Time's up! Word was: "${ciphers[cIndex].word}"`;
            statusMsg.className = "status-msg wrong";
            setTimeout(() => {
                cIndex++;
                loadCipher();
            }, 1800);
        }

        submitBtn.addEventListener('click', checkAnswer);
        hintBtn.addEventListener('click', revealHint);
        skipBtn.addEventListener('click', skipCipher);
        restartBtn.addEventListener('click', initGame);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

        // Start
        initGame();
    </script>
</body>
