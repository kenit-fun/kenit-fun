<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Station - KenitFun</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
        :root { --bg: #12100e; --paper: #1c1815; --ink: #d4c3b3; --accent: #8c4a32; --border: #4a3c31; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: 'Special Elite', cursive, serif; color: var(--ink); padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { display: flex; justify-content: space-between; width: 100%; max-width: 700px; margin-bottom: 2rem; }
        .back-btn { background: #25201b; border: 2px solid var(--border); padding: 0.5rem 1rem; color: var(--ink); text-decoration: none; font-weight: bold; }
        .story-card { background: var(--paper); border: 3px solid var(--border); box-shadow: 0 0 20px rgba(0,0,0,0.8); width: 100%; max-width: 700px; padding: 2.5rem; }
        .narrative { font-size: 1.15rem; line-height: 1.7; margin-bottom: 2rem; min-height: 120px; }
        .choices { display: flex; flex-direction: column; gap: 1rem; }
        .choice-btn { background: #28211b; border: 2px solid var(--border); color: var(--ink); padding: 0.8rem 1.2rem; text-align: left; font-family: inherit; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        .choice-btn:hover { background: var(--accent); border-color: #fff; }
		@media only screen and (max-width: 640px) {
			
			header {
			 flex-direction: column
			}
			header h2 {
				margin-top: 30px;
				}
		}
    </style>
</head>
<body>
    <header>
        <a href="../../index.html" class="back-btn">&larr; KENITFUN</a>
        <h2>MIDNIGHT STATION</h2>
    </header>

    <div class="story-card">
        <div class="narrative" id="storyText">Loading story...</div>
        <div class="choices" id="choiceBox"></div>
    </div>

    <script>
        const storyData = {
            start: {
                text: "Midnight. Thick fog rolls over the tracks of an abandoned 1920s train station. Suddenly, a lone payphone on the wooden platform begins to ring loudly.",
                options: [
                    { label: "📞 Pick up the ringing phone", next: "answerPhone" },
                    { label: "🎟️ Walk toward the locked ticket booth", next: "ticketBooth" }
                ]
            },
            answerPhone: {
                text: "You lift the cold brass receiver. A whisper comes through the static: 'The 12:15 ghost train is on time. Do not board with brass coins.' The line goes dead.",
                options: [
                    { label: "🔍 Search your pockets for coins", next: "checkPockets" },
                    { label: "🏃 Run out of the station into the fog", next: "escape" }
                ]
            },
            ticketBooth: {
                text: "The glass window is cracked. Inside, a rusty metal key sits on top of a dusty ledger.",
                options: [
                    { label: "🔑 Reach in and grab the key", next: "grabKey" },
                    { label: "🔙 Return to the platform", next: "start" }
                ]
            },
            checkPockets: { text: "You find a single brass coin. Seconds later, a phantom steam engine roars onto the platform... YOU SURVIVED THE NIGHT! (Ending 1/3)", options: [{ label: "🔄 Play Again", next: "start" }] },
            escape: { text: "You flee into the dark forest. You survived, but the mystery of the station remains unsolved forever. (Ending 2/3)", options: [{ label: "🔄 Play Again", next: "start" }] },
            grabKey: { text: "As you grab the key, the station lights flash violently! You unlocked the secret vault of 1924! (Ending 3/3)", options: [{ label: "🔄 Play Again", next: "start" }] }
        };

        function renderScene(key) {
            const scene = storyData[key];
            document.getElementById('storyText').innerText = scene.text;
            const choiceBox = document.getElementById('choiceBox');
            choiceBox.innerHTML = '';

            scene.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = opt.label;
                btn.onclick = () => renderScene(opt.next);
                choiceBox.appendChild(btn);
            });
        }

        renderScene('start');
    </script>
</body>
</html>
