        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, duration = 0.1, type = 'sine') {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { }
        }

        // Shuffle Function for Random Levels
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

                        slot.innerText = userInputs[inputIdx].char;
                        let keyObj = userInputs[inputIdx];
                        slot.onclick = () => removeLetter(keyObj);
                    }
                    inputIdx++;
                }
                answerSlots.appendChild(slot);
            }
        }

        function generateKeyboard() {
            keyboard.innerHTML = '';
            let cleanAnswer = currentAnswer.replace(/\s/g, '');
            let letters = cleanAnswer.split('');

            let totalKeys = Math.max(12, cleanAnswer.length + 3);
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

            while (letters.length < totalKeys) {
                let randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                letters.push(randomChar);
            }

            letters.sort(() => Math.random() - 0.5);

            keyMapping = letters.map((char, index) => ({ id: index, char: char, used: false }));

            keyMapping.forEach(item => {
                let btn = document.createElement('button');
                btn.className = 'key-btn';
                btn.innerText = item.char;
                btn.id = `key-${item.id}`;
                btn.onclick = () => selectLetter(item);
                keyboard.appendChild(btn);
            });
        }

        function selectLetter(item) {
            initAudio();
            let cleanAnswerLength = currentAnswer.replace(/\s/g, '').length;
            if (userInputs.length >= cleanAnswerLength || item.used) return;

            item.used = true;
            userInputs.push(item);
            document.getElementById(`key-${item.id}`).classList.add('disabled');

            playSound(500, 0.08);
            renderSlots();
            checkAnswer();
        }

        function removeLetter(itemObj) {
            initAudio();
            userInputs = userInputs.filter(x => x.id !== itemObj.id);
            itemObj.used = false;
            document.getElementById(`key-${itemObj.id}`).classList.remove('disabled');

            playSound(300, 0.08);
            renderSlots();
        }

        function clearAll() {
            initAudio();
            userInputs.forEach(item => {
                item.used = false;
                document.getElementById(`key-${item.id}`).classList.remove('disabled');
            });
            userInputs = [];
            playSound(250, 0.1);
            renderSlots();
        }

        function checkAnswer() {
            let cleanAnswer = currentAnswer.replace(/\s/g, '');
            if (userInputs.length === cleanAnswer.length) {
                let userString = userInputs.map(x => x.char).join('');
                if (userString === cleanAnswer) {
                    playSound(880, 0.2, 'triangle');
                    score += 50;
                    currentLevel++;
                    setTimeout(loadLevel, 400);
                } else {
                    playSound(150, 0.2, 'sawtooth');
                }
            }
        }

        hintBtn.addEventListener('click', () => {
            initAudio();
            if (score < 20) return;

            let cleanAnswer = currentAnswer.replace(/\s/g, '');
            for (let i = 0; i < cleanAnswer.length; i++) {
                if (!userInputs[i] || userInputs[i].char !== cleanAnswer[i]) {
                    let targetKey = keyMapping.find(k => k.char === cleanAnswer[i] && !k.used);
                    if (targetKey) {
                        score -= 20;
                        scoreVal.innerText = score;
                        selectLetter(targetKey);
                    }
                    break;
                }
            }
        });

        skipBtn.addEventListener('click', () => {
            initAudio();
            playSound(400, 0.15, 'square');
            if (score >= 10) {
                score -= 10;
            } else {
                score = 0;
            }
            currentLevel++;
            loadLevel();
        });

        clearBtn.addEventListener('click', clearAll);

        startBtn.addEventListener('click', () => {
            initAudio();
            gameModal.classList.add('hidden');
            quizData = shuffleArray(rawQuizData);
            currentLevel = 0;
            score = 0;
            loadLevel();
        });
    </script>
</body>

</html>
